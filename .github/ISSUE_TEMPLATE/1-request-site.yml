name: Request_Site
description: Request support for a new site

title: "[Request] <site-domain>"
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        **Important:** AdsBypasser does **NOT** bypass reCAPTCHA.

        **Note:** Please update the issue title to include the site domain:
        `[Request] example.com`

  - type: input
    id: site-domain
    attributes:
      label: Site Domain
      description: What is the domain of the site you want to be supported?
      placeholder: example.com
    validations:
      required: true

  - type: input
    id: full-link
    attributes:
      label: Full Link
      description: Please paste the complete URL, including https://
      placeholder: https://example.com/link
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the site and why you would like it to be supported.
      placeholder: Describe the site and why it should be supported.
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Provide any other information that may be useful.
      placeholder: Add any relevant details, examples, or screenshots here.

  - type: markdown
    attributes:
      value: |
        **Before submitting:**
        1. Please check if there is an existing ticket open for the same site.
        2. Make sure the site is not already supported by AdsBypasser.
        3. Make sure you have provided a complete URL and a clear description of the site.
