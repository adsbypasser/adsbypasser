remote_theme: pages-themes/midnight@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

title: AdsBypasser
description: A lightweight userscript that automatically skips countdown ads

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

exclude:
  - node_modules/
  - Gemfile
  - Gemfile.lock

include:
  - _data
